<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fafaf7"/>
      <stop offset="100%" stop-color="#f3f1ec"/>
    </linearGradient>
    <radialGradient id="glow" cx="85%" cy="15%" r="50%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e8e4dc" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.5"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Top-left brand mark -->
  <g transform="translate(80, 80)">
    <rect width="48" height="48" rx="12" fill="#1a1a1a"/>
    <text x="24" y="32" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="16" font-weight="600" fill="#fafaf7" text-anchor="middle" letter-spacing="0.5">JA</text>
  </g>

  <!-- Eyebrow -->
  <text x="80" y="290" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="16" font-weight="500" fill="#8a8a8a" letter-spacing="2">SOFTWARE ENGINEER</text>

  <!-- Display title -->
  <text x="80" y="400" font-family="'Instrument Serif', 'Times New Roman', serif" font-size="120" fill="#1a1a1a" letter-spacing="-2">Jefferson <tspan font-style="italic" fill="#c2410c">Adjetey</tspan></text>

  <!-- Subtitle -->
  <text x="80" y="460" font-family="-apple-system, 'Inter', sans-serif" font-size="26" fill="#5e5e5e">Building developer infrastructure at Oracle Cloud · Co-founder, Praecept</text>

  <!-- Bottom-left URL -->
  <text x="80" y="560" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="18" font-weight="500" fill="#1a1a1a">jeffersonadjetey.com</text>

  <!-- Bottom-right meta -->
  <text x="1120" y="560" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="18" font-weight="400" fill="#8a8a8a" text-anchor="end">Dartmouth CS '24</text>
</svg>
